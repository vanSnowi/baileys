name: Publish to GitHub Packages

# Publishes the package to GitHub Packages whenever a version tag (v1.2.3) is
# pushed. Uses the built-in GITHUB_TOKEN — no extra secret needed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@vansnowi'

      # protobufjs is only needed to generate WAProto/wa-table.json from the
      # .proto — install deps (skip lifecycle scripts) then generate the table so
      # it ships inside the published tarball.
      - name: Install deps
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate proto table
        run: node WAProto/compiler.js

      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
